<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Workout Helper</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply stored language and theme before first paint to avoid a flash of the wrong theme.
      // Storage keys must match LocalStorage/I18n/Theme in src/app/core.
      (function () {
        try {
          var root = document.documentElement;
          var language = JSON.parse(localStorage.getItem('workout-helper.language') || '"de"');
          var theme = JSON.parse(localStorage.getItem('workout-helper.theme') || '"system"');
          var accent = JSON.parse(localStorage.getItem('workout-helper.accent') || '"red"');
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.lang = language === 'en' ? 'en' : 'de';
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.accent = /^[a-z]+$/.test(accent) ? accent : 'red';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
